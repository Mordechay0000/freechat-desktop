name: msys2-diag

# One-off: does the pkgconf that MSYS2 ships today still find a .pc file through
# PKG_CONFIG_PATH the way upstream's build_ffmpeg_win.sh sets it? ffmpeg's
# configure failed with "dav1d >= 0.5.0 not found using pkg-config".
on:
  push:
    branches: [auto/inspiring-gauss-9eryy9]
    paths: [".github/workflows/msys2-diag.yml"]

jobs:
  diag:
    runs-on: windows-2025
    steps:
      - name: pkgconf and PKG_CONFIG_PATH
        shell: cmd
        run: |
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm mingw-w64-x86_64-pkgconf >/dev/null; export PATH=/mingw64/bin:$PATH; which pkg-config pkgconf; pkg-config --version; mkdir -p /d/x/Libraries/local/lib/pkgconfig /d/x/Libraries/ffmpeg; printf 'prefix=/d/x\nlibdir=${prefix}/lib\nName: dav1d\nDescription: t\nVersion: 1.5.4\nLibs: -L${libdir} -ldav1d\n' > /d/x/Libraries/local/lib/pkgconfig/dav1d.pc; cd /d/x/Libraries/ffmpeg; FullExecPath=$PWD; echo '--- script style (/d/...:)'; export PKG_CONFIG_PATH=\"$FullExecPath/../local/lib/pkgconfig:$PKG_CONFIG_PATH\"; echo $PKG_CONFIG_PATH; pkg-config --exists --print-errors 'dav1d >= 0.5.0'; echo exit=$?; echo '--- windows style'; export PKG_CONFIG_PATH=\"$(cygpath -m /d/x/Libraries/local/lib/pkgconfig)\"; echo $PKG_CONFIG_PATH; pkg-config --exists --print-errors 'dav1d >= 0.5.0'; echo exit=$?; echo '--- debug'; pkg-config --list-all | head; pkg-config --variable pc_path pkg-config"
