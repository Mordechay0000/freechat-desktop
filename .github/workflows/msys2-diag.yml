name: msys2-diag

# One-off diagnosis: why does upstream's prepare stage 'msys64' fail with
# "target not found: mingw-w64-x86_64-diffutils"? Runs only when this file changes.
on:
  push:
    branches: [auto/inspiring-gauss-9eryy9]
    paths: [".github/workflows/msys2-diag.yml"]

jobs:
  diag:
    runs-on: windows-2025
    steps:
      - name: What the repositories offer today
        shell: cmd
        run: |
          C:\msys64\usr\bin\bash.exe -lc "pacman -Sy --noconfirm; echo ---repos; grep -E '^\[' /etc/pacman.conf; echo ---diffutils; pacman -Ss diffutils; echo ---gperf; pacman -Ss '^mingw-w64-x86_64-gperf'; echo ---nasm; pacman -Ss '^mingw-w64-x86_64-nasm'; echo ---perl; pacman -Ss '^mingw-w64-x86_64-perl$'; echo ---pkgconf; pacman -Ss '^mingw-w64-x86_64-pkgconf'"
