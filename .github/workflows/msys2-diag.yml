name: msys2-diag

# One-off: breakpad failed with "Cannot open include file: 'atlbase.h'". Which
# Visual Studio component puts ATL under the 14.44 toolset that
# vcvarsall -vcvars_ver=14.44 selects, and does adding it to the existing
# install work?
on:
  push:
    branches: [auto/inspiring-gauss-9eryy9]
    paths: [".github/workflows/msys2-diag.yml"]

jobs:
  diag:
    runs-on: windows-2025
    steps:
      - name: Before
        shell: pwsh
        run: |
          $vs = "C:\Program Files\Microsoft Visual Studio\18\Enterprise"
          "--- toolsets"
          Get-ChildItem "$vs\VC\Tools\MSVC" | Select-Object Name
          "--- atlbase.h anywhere under the install (before)"
          Get-ChildItem $vs -Recurse -Filter atlbase.h -ErrorAction SilentlyContinue | Select-Object -First 10 FullName
          "--- installer"
          Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer" -Filter *.exe | Select-Object Name
          "--- ATL components the installer knows"
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -products * -format json | ConvertFrom-Json | ForEach-Object { $_.installationPath }

      - name: Add the 14.44 ATL component
        shell: pwsh
        run: |
          $vs = "C:\Program Files\Microsoft Visual Studio\18\Enterprise"
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            'modify','--installPath',"`"$vs`"",
            '--add','Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL',
            '--quiet','--norestart','--noUpdateInstaller')
          "installer exit code: $($p.ExitCode)"

      - name: After
        shell: pwsh
        run: |
          $vs = "C:\Program Files\Microsoft Visual Studio\18\Enterprise"
          "--- atlbase.h under the install (after)"
          Get-ChildItem $vs -Recurse -Filter atlbase.h -ErrorAction SilentlyContinue | Select-Object -First 10 FullName
