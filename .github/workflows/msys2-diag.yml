name: msys2-diag

# One-off probe. The previous Windows diagnostic jobs failed within 2 seconds with
# no steps and no log, twice. Does a trivial Linux job start at all? If not, the
# problem is the account (minutes quota / billing), not the workflow.
on:
  push:
    branches: [auto/inspiring-gauss-9eryy9]
    paths: [".github/workflows/msys2-diag.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "linux job started"
