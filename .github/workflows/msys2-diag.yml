name: msys2-diag

# One-off, small. (1) Does scripts/build-desktop.ps1 parse in the PowerShell that runs
# it? (2) Does /p:UseStructuredOutput=false switch off the structured compiler
# output that made a full build die with OutOfMemoryException?
on:
  push:
    branches: [auto/inspiring-gauss-9eryy9]
    paths: [".github/workflows/msys2-diag.yml"]

jobs:
  diag:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Syntax of build-desktop.ps1 (PowerShell 7 and Windows PowerShell 5.1)
        shell: pwsh
        run: |
          $script = Join-Path $PWD 'scripts\build-desktop.ps1'
          $e = $null
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$null, [ref]$e) | Out-Null
          if ($e) { "pwsh 7 parse errors:"; $e | ForEach-Object { "  $($_.Message) at line $($_.Extent.StartLineNumber)" }; exit 1 } else { "pwsh 7: parse ok" }
          powershell -NoProfile -Command "`$e=`$null; [System.Management.Automation.Language.Parser]::ParseFile('$script',[ref]`$null,[ref]`$e) | Out-Null; if (`$e) { `$e | ForEach-Object { '  ' + `$_.Message + ' at line ' + `$_.Extent.StartLineNumber }; exit 1 } else { 'powershell 5.1: parse ok' }"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Structured output with and without the property
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64 -vcvars_ver=14.44
          mkdir t && cd t
          echo cmake_minimum_required(VERSION 3.20) > CMakeLists.txt
          echo project(t CXX) >> CMakeLists.txt
          echo add_executable(t a.cpp b.cpp) >> CMakeLists.txt
          echo int f(); int main(){ return f(); } > a.cpp
          echo int f(){ int unused; return 0; } > b.cpp
          cmake -S . -B b
          dir b\*.sln b\*.slnx b\*.vcxproj
          where msbuild
          echo === DEFAULT: msbuild output ===
          msbuild b\t.vcxproj /p:Configuration=Release /p:Platform=x64 /t:Rebuild /v:d > default.log 2>&1
          echo exit=%errorlevel%
          findstr /i /c:"structured" /c:"MSB8085" /c:"error" default.log
          echo === UseStructuredOutput=false: msbuild output ===
          msbuild b\t.vcxproj /p:Configuration=Release /p:Platform=x64 /p:UseStructuredOutput=false /t:Rebuild /v:d > off.log 2>&1
          echo exit=%errorlevel%
          findstr /i /c:"structured" /c:"MSB8085" /c:"error" off.log
          echo === line counts ===
          find /c /v "" default.log off.log
          echo === done ===
          exit /b 0
