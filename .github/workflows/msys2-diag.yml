name: msys2-diag

# One-off, small. (1) build-desktop.ps1 parses in PowerShell 7 and 5.1. (2) does
# /p:CL_MPCount=2 become /MP2 on the cl.exe command line, and /m:2 get accepted?
# (3) does the pagefile step exactly as written in windows.yml work?
on:
  push:
    branches: [auto/inspiring-gauss-9eryy9]
    paths: [".github/workflows/msys2-diag.yml"]

jobs:
  diag:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Syntax of build-desktop.ps1
        shell: pwsh
        run: |
          $script = Join-Path $PWD 'scripts\build-desktop.ps1'
          $e = $null
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$null, [ref]$e) | Out-Null
          if ($e) { $e | ForEach-Object { "  $($_.Message) at line $($_.Extent.StartLineNumber)" }; exit 1 } else { "pwsh 7: parse ok" }
          powershell -NoProfile -Command "`$e=`$null; [System.Management.Automation.Language.Parser]::ParseFile('$script',[ref]`$null,[ref]`$e) | Out-Null; if (`$e) { `$e | ForEach-Object { '  ' + `$_.Message + ' at line ' + `$_.Extent.StartLineNumber }; exit 1 } else { 'powershell 5.1: parse ok' }"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: The pagefile step as written in windows.yml
        shell: pwsh
        run: |
          $before = (Get-CimInstance Win32_OperatingSystem).TotalVirtualMemorySize*1KB/1GB
          New-CimInstance -ClassName Win32_PageFileSetting -Property @{ Name = 'D:\extra-pagefile.sys'; InitialSize = [uint32]24576; MaximumSize = [uint32]24576 } -ErrorAction Stop | Out-Null
          Start-Sleep -Seconds 5
          $after = (Get-CimInstance Win32_OperatingSystem).TotalVirtualMemorySize*1KB/1GB
          "commit limit: {0:N1} GB -> {1:N1} GB" -f $before, $after

      - name: CL_MPCount and /m:N, run the way the script runs msbuild
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64 -vcvars_ver=14.44
          mkdir t && cd t
          echo cmake_minimum_required(VERSION 3.20) > CMakeLists.txt
          echo project(t CXX) >> CMakeLists.txt
          echo add_executable(t a.cpp b.cpp c.cpp d.cpp) >> CMakeLists.txt
          echo int f(); int main(){ return f(); } > a.cpp
          echo int f(){ return 0; } > b.cpp
          echo int g(){ return 1; } > c.cpp
          echo int h(){ return 2; } > d.cpp
          cmake -S . -B b
          echo === CL_MP=true only ===
          msbuild b\t.vcxproj /p:Configuration=Release /p:Platform=x64 /p:CL_MP=true /m:2 /t:Rebuild /v:d > mp.log 2>&1
          echo exit=%errorlevel%
          findstr /c:"CL.exe /c" mp.log | findstr /o /c:"/MP"
          echo === CL_MP=true CL_MPCount=2 ===
          msbuild b\t.vcxproj /p:Configuration=Release /p:Platform=x64 /p:CL_MP=true /p:CL_MPCount=2 /m:2 /t:Rebuild /v:d > mp2.log 2>&1
          echo exit=%errorlevel%
          for %%L in (mp.log mp2.log) do (echo --- %%L & findstr /i /r /c:"[ ]/MP[0-9]*[ ]" %%L)
          exit /b 0
