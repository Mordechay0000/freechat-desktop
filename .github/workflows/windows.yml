name: windows

# Builds FreeChat Desktop for Windows with the repository's own scripts, the same
# ones documented in docs/10-DESKTOP.md. Nothing here re-implements the build;
# each step is one script invocation, so a failure in CI reproduces locally.
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Windows architecture
        type: choice
        options: [x64, arm64]
        default: x64
  push:
    branches: [auto/inspiring-gauss-9eryy9]
    paths-ignore: [".github/workflows/msys2-diag.yml"]
    tags: ["v*"]

# A newer push replaces a run that is still going: a full run takes hours.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # only used to attach the zip to a release

jobs:
  build:
    # A push whose commit message contains [skip-windows] does not start the build,
    # so scripts and diagnostics can be pushed without paying for hours of Windows.
    if: ${{ !contains(github.event.head_commit.message, '[skip-windows]') }}
    runs-on: windows-2025
    timeout-minutes: 360          # GitHub's hard ceiling for one job
    env:
      ARCH: ${{ inputs.arch || 'x64' }}
    steps:
      # The Qt tree is deeper than 260 characters, so the repository goes to a short
      # path instead of actions/checkout's. D: and not C:, because prepare needs
      # ~45GB and the image leaves C: with ~30GB free (D: has ~78GB).
      - name: Clone to D:\fc
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config --global core.longpaths true
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" /d/fc
          git -C /d/fc checkout "${GITHUB_SHA}"

      - name: Disk before
        run: Get-PSDrive C, D | Format-Table Name, Used, Free

      - name: Bootstrap and overlay
        shell: bash
        working-directory: D:\fc
        run: |
          cp freechat.env.example freechat.env
          ./scripts/bootstrap.sh desktop --with-submodules
          ./scripts/apply-overlay.sh

      - name: Install missing tools
        working-directory: D:\fc
        run: powershell -ExecutionPolicy Bypass -File scripts\build-desktop.ps1 -Stage install -Arch $env:ARCH

      # Informational: it reports "prepared Qt missing" as a blocking problem before
      # prepare has run, which is the expected state here.
      - name: Doctor
        continue-on-error: true
        working-directory: D:\fc
        run: powershell -ExecutionPolicy Bypass -File scripts\build-desktop.ps1 -Stage doctor -Arch $env:ARCH

      - name: Prepare (Qt and libraries)
        # A run was seen to go silent mid-compile for over an hour (libvpx, no error,
        # no output). Without this the job would sit until GitHub's 6-hour limit.
        timeout-minutes: 240
        working-directory: D:\fc
        run: powershell -ExecutionPolicy Bypass -File scripts\build-desktop.ps1 -Stage prepare -Arch $env:ARCH

      # What the log alone cannot show: the library that prepare was configuring
      # when it stopped, and what the build left where it was looked for.
      - name: Why prepare failed
        if: failure()
        working-directory: D:\fc
        run: |
          $ff = "desktop\Libraries\win64\ffmpeg\ffbuild\config.log"
          if (Test-Path $ff) { "--- tail of $ff"; Get-Content $ff -Tail 80 }
          "--- pkg-config files under Libraries"
          Get-ChildItem desktop\Libraries -Recurse -Filter *.pc -ErrorAction SilentlyContinue | Select-Object -First 40 FullName

      - name: Configure
        working-directory: D:\fc
        run: powershell -ExecutionPolicy Bypass -File scripts\build-desktop.ps1 -Stage configure -Arch $env:ARCH

      - name: Build
        working-directory: D:\fc
        run: powershell -ExecutionPolicy Bypass -File scripts\build-desktop.ps1 -Stage build -Arch $env:ARCH

      - name: Package
        working-directory: D:\fc
        run: |
          $rel = "desktop\upstream\out\Release"
          Get-ChildItem $rel | Format-Table Name, Length
          $zip = "FreeChat-windows-$env:ARCH.zip"
          Compress-Archive -Path "$rel\*" -DestinationPath $zip -Force
          "ZIP=$zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: FreeChat-windows-${{ env.ARCH }}
          path: D:\fc\${{ env.ZIP }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: D:\fc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes "" }
          gh release upload "${{ github.ref_name }}" $env:ZIP --clobber
