name: windows

# Builds FreeChat Desktop for Windows with the repository's own scripts, the same
# ones documented in docs/10-DESKTOP.md. Nothing here re-implements the build;
# each step is one script invocation, so a failure in CI reproduces locally.
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Windows architecture
        type: choice
        options: [x64, arm64]
        default: x64
  push:
    branches: [auto/inspiring-gauss-9eryy9]
    tags: ["v*"]

permissions:
  contents: write   # only used to attach the zip to a release

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 360          # GitHub's hard ceiling for one job
    env:
      ARCH: ${{ inputs.arch || 'x64' }}
    steps:
      # The Qt tree is deeper than 260 characters. The workspace is D:\a\...\...,
      # so the repository is cloned to a short path instead of actions/checkout's.
      - name: Clone to C:\fc
        shell: bash
        run: |
          git config --global core.longpaths true
          git clone "https://github.com/${GITHUB_REPOSITORY}" /c/fc
          git -C /c/fc checkout "${GITHUB_SHA}"

      - name: Disk before
        run: Get-PSDrive C, D | Format-Table Name, Used, Free

      - name: Bootstrap and overlay
        shell: bash
        working-directory: C:\fc
        run: |
          cp freechat.env.example freechat.env
          ./scripts/bootstrap.sh desktop --with-submodules
          ./scripts/apply-overlay.sh

      - name: Install missing tools
        working-directory: C:\fc
        run: powershell -ExecutionPolicy Bypass -File scripts\build-desktop.ps1 -Stage install -Arch $env:ARCH

      - name: Doctor
        working-directory: C:\fc
        run: powershell -ExecutionPolicy Bypass -File scripts\build-desktop.ps1 -Stage doctor -Arch $env:ARCH

      - name: Prepare (Qt and libraries)
        working-directory: C:\fc
        run: powershell -ExecutionPolicy Bypass -File scripts\build-desktop.ps1 -Stage prepare -Arch $env:ARCH

      - name: Configure
        working-directory: C:\fc
        run: powershell -ExecutionPolicy Bypass -File scripts\build-desktop.ps1 -Stage configure -Arch $env:ARCH

      - name: Build
        working-directory: C:\fc
        run: powershell -ExecutionPolicy Bypass -File scripts\build-desktop.ps1 -Stage build -Arch $env:ARCH

      - name: Package
        working-directory: C:\fc
        run: |
          $rel = "desktop\upstream\out\Release"
          Get-ChildItem $rel | Format-Table Name, Length
          $zip = "FreeChat-windows-$env:ARCH.zip"
          Compress-Archive -Path "$rel\*" -DestinationPath $zip -Force
          "ZIP=$zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: FreeChat-windows-${{ env.ARCH }}
          path: C:\fc\${{ env.ZIP }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: C:\fc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes "" }
          gh release upload "${{ github.ref_name }}" $env:ZIP --clobber
